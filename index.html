<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Stok Barang - Hexanet</title>
    <!-- Menggunakan Tailwind CSS untuk desain yang bersih dan cepat -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

    <!-- CONTAINER UTAMA -->
    <div class="bg-white w-full max-w-md rounded-xl shadow-lg p-6">
        
        <!-- ================= BAGIAN HALAMAN LOGIN ================= -->
        <div id="loginSection">
            <div class="flex flex-col items-center justify-center mb-6">
                <img src="LOGO HEXANET.png" alt="Logo Hexanet" class="h-14 mb-3 object-contain">
                <h1 class="text-xl font-bold text-gray-800 text-center">Login Sistem</h1>
                <p class="text-sm text-gray-500 text-center">Silakan masuk untuk mengelola stok</p>
            </div>

            <div id="loginAlert" class="hidden mb-4 p-3 rounded-lg text-sm text-center font-medium bg-red-100 text-red-700"></div>

            <form onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Username</label>
                    <input type="text" id="username" required 
                        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                        placeholder="Masukkan username">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                    <input type="password" id="password" required 
                        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                        placeholder="Masukkan password">
                </div>

                <button type="submit" 
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg transition duration-200">
                    Masuk
                </button>
            </form>
        </div>

        <!-- ================= BAGIAN HALAMAN UTAMA STOK (Awalnya Disembunyikan) ================= -->
        <div id="appSection" class="hidden">
            <!-- Bagian Header dengan Logo Hexanet -->
            <div class="flex flex-col items-center justify-center mb-6 relative">
                <!-- Tombol Logout di pojok kanan atas -->
                <button onclick="handleLogout()" class="absolute top-0 right-0 text-xs bg-red-50 hover:bg-red-100 text-red-600 font-semibold px-2.5 py-1 rounded-md transition">
                    Keluar
                </button>

                <img src="LOGO HEXANET.png" alt="Logo Hexanet" class="h-14 mb-3 object-contain">
                <h1 class="text-xl font-bold text-gray-800 text-center">Kelola Stok Barang</h1>
                <p class="text-sm text-gray-500 text-center">Catat barang masuk dan keluar secara real-time</p>
            </div>

            <!-- Alert Notifikasi Stok -->
            <div id="alertBox" class="hidden mb-4 p-3 rounded-lg text-sm text-center font-medium"></div>

            <!-- Form Input Stok -->
            <form id="stockForm" onsubmit="handleSubmit(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Nama Barang</label>
                    <input type="text" id="namaBarang" required 
                        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                        placeholder="Contoh: Kabel Fiber / ONU ZTE">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Tipe Transaksi</label>
                    <select id="tipe" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <option value="Masuk">Barang Masuk</option>
                        <option value="Keluar">Barang Keluar</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Jumlah</label>
                    <input type="number" id="jumlah" min="1" required 
                        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                        placeholder="Masukkan angka">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Keterangan (Opsional)</label>
                    <textarea id="keterangan" rows="2" 
                        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                        placeholder="Contoh: Dari Supplier / Untuk Instalasi Pelanggan"></textarea>
                </div>

                <button type="submit" id="submitBtn"
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg transition duration-200">
                    Simpan Data
                </button>
            </form>
        </div>

    </div>

    <script>
        // --- KONFIGURASI LOGIN ---
        const USERNAME_VALID = "admin";
        const PASSWORD_VALID = "korengan17"; // Anda bisa mengubah password ini sesuai keinginan
		
        // Cek apakah sebelumnya sudah login saat halaman direfresh
        window.onload = function() {
            if (localStorage.getItem("isLoggedIn") === "true") {
                showApp();
            }
        };

        function handleLogin(event) {
            event.preventDefault();
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            const loginAlert = document.getElementById('loginAlert');

            if (user === USERNAME_VALID && pass === PASSWORD_VALID) {
                localStorage.setItem("isLoggedIn", "true");
                showApp();
            } else {
                loginAlert.innerText = "Username atau Password salah!";
                loginAlert.classList.remove('hidden');
            }
        }

        function showApp() {
            document.getElementById('loginSection').classList.add('hidden');
            document.getElementById('appSection').classList.remove('hidden');
        }

        function handleLogout() {
            localStorage.removeItem("isLoggedIn");
            document.getElementById('username').value = "";
            document.getElementById('password').value = "";
            document.getElementById('loginAlert').classList.add('hidden');
            document.getElementById('appSection').classList.add('hidden');
            document.getElementById('loginSection').classList.remove('hidden');
        }


        // --- INTEGRASI GOOGLE SHEET ---
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxMyHjK0nrnzokt9nBedd0dOi7fRbvUJt9t4OeVR2tKqcy5ZjV280nKpgsNkBxOBDGVGA/exec";

        async function handleSubmit(event) {
            event.preventDefault();

            const btn = document.getElementById('submitBtn');
            const alertBox = document.getElementById('alertBox');
            
            // Nonaktifkan tombol saat proses kirim
            btn.disabled = true;
            btn.innerText = "Menyimpan...";
            alertBox.classList.add('hidden');

            const payload = {
                namaBarang: document.getElementById('namaBarang').value,
                tipe: document.getElementById('tipe').value,
                jumlah: document.getElementById('jumlah').value,
                keterangan: document.getElementById('keterangan').value
            };

            try {
                await fetch(WEB_APP_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(payload)
                });

                // Tampilkan pesan sukses
                alertBox.className = "mb-4 p-3 rounded-lg text-sm text-center font-medium bg-green-100 text-green-700";
                alertBox.innerText = "Data berhasil dikirim ke Google Sheet!";
                alertBox.classList.remove('hidden');

                // Reset form
                document.getElementById('stockForm').reset();

            } catch (error) {
                console.error('Error:', error);
                alertBox.className = "mb-4 p-3 rounded-lg text-sm text-center font-medium bg-red-100 text-red-700";
                alertBox.innerText = "Terjadi kesalahan saat menyimpan data.";
                alertBox.classList.remove('hidden');
            } finally {
                btn.disabled = false;
                btn.innerText = "Simpan Data";
            }
        }
    </script>
</body>
</html>
